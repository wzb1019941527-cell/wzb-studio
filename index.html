<!doctype html>
<html lang="en" prefix="og: https://ogp.me/ns#">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ═══ 基础 SEO ═══ -->
    <title>WZB Studio — Space Stylist & Interior Curator</title>
    <meta
      name="description"
      content="WZB Studio is a Shenzhen-based spatial styling and interior curation atelier — gallery-grade soft furnishing, exhibition design, and fine-art research for residential, hospitality, and commercial spaces across China."
    />
    <meta name="author" content="WZB Studio" />
    <meta name="theme-color" content="#0A0A0A" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <!-- 上线前请替换为正式域名 -->
    <link rel="canonical" href="https://www.wzb.studio/" />

    <!-- ═══ 图标 ═══ -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/og-image.png" />

    <!-- ═══ Open Graph（社交分享卡片）═══ -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WZB Studio" />
    <meta property="og:title" content="WZB Studio — Space Stylist & Interior Curator" />
    <meta
      property="og:description"
      content="A Shenzhen-based spatial styling and interior curation atelier — gallery-grade soft furnishing, exhibition design, and fine-art research."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="WZB Studio — Space Stylist & Interior Curator" />
    <meta property="og:url" content="https://www.wzb.studio/" />
    <meta property="og:locale" content="en_US" />

    <!-- ═══ Twitter Card ═══ -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="WZB Studio — Space Stylist & Interior Curator" />
    <meta
      name="twitter:description"
      content="A Shenzhen-based spatial styling and interior curation atelier — gallery-grade soft furnishing, exhibition design, and fine-art research."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- ═══ 字体 ═══ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400&display=swap"
      rel="stylesheet"
    />
    <!-- 中文极细宋体 -->
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@200;300;400&display=swap"
      rel="stylesheet"
    />
    <!-- 技术铭牌等宽体（Space Mono） -->
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <!-- 先锋建筑宽体 Display（Syne，全大写 + 极高字距，策展人气质） -->
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
